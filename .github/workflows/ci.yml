name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet test tests/Usage.Tests -c Release
      - run: dotnet publish src/Usage.Windows -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with: { name: UsageMonitor-windows, path: out/UsageMonitor.exe }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
